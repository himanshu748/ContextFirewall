version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # mcp 2.x removed FastMCP; migrating is a deliberate change (see #36).
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
